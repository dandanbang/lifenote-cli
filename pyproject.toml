[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lifenote"
version = "0.1.0"
description = "Bring your private journal into your AI agents — Claude Code, Cursor, Codex. MCP-compatible."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel W. Chen", email = "daniel@mylifenote.ai" }]
requires-python = ">=3.10"
keywords = ["journaling", "mcp", "ai-agents", "claude-code", "cursor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "keyring>=24.0",
  "rich>=13.0",
  "mcp>=1.0",
]

[project.urls]
Homepage = "https://www.mylifenote.ai"
Source = "https://github.com/dandanbang/lifenote-cli"
Issues = "https://github.com/dandanbang/lifenote-cli/issues"

[project.scripts]
lifenote = "lifenote.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lifenote"]
